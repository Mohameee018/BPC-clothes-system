async function loadProfitData(){
 const [orders,expenses,products,returns]=await Promise.all([fetchAll("/api/admin/orders"),fetchAll("/api/system/expenses"),fetchAll("/api/system/products"),fetchAll("/api/system/returns")]);
 const productCosts=new Map(products.map(p=>[String(p.id),Number(p.cost_price||0)]));
 const returnByOrder=new Map();
 returns.forEach(x=>{if(x.order_id)returnByOrder.set(String(x.order_id),x)});
 const orderCogs=o=>(o.order_items||[]).reduce((n,i)=>{const itemCost=Number(i.cost_price||0),fallback=Number(productCosts.get(String(i.product_id))||0);return n+Number(i.quantity||0)*(itemCost>0?itemCost:fallback)},0);

}
function calculateProfit(data,r){
 const inRange=v=>{const d=new Date(v||"");return Number.isFinite(d.getTime())&&d>=r.from&&d<r.to};
 let sales=0,cost=0,expenses=0,refunds=0,scrapLoss=0,ordersCount=0;
 data.orders.forEach(o=>{
   const hasReturn=data.returnByOrder.has(String(o.id)); const eligible=hasReturn?(o.payment_status==="paid"||["confirmed","Completed"].includes(o.order_status)):(!/cancel|failed|return|damaged/i.test(String(o.order_status||"")+" "+String(o.delivery_status||""))&&(o.payment_status==="paid"||["confirmed","Completed"].includes(o.order_status)));
   if(eligible&&inRange(o.created_at)){sales+=Number(o.total_amount||0);cost+=data.orderCogs(o);ordersCount++}
 });
 data.returns.forEach(x=>{
   if(!inRange(x.created_at))return;
   const order=data.orders.find(o=>String(o.id)===String(x.order_id));
   const cogs=order?data.orderCogs(order):0;
   refunds+=Number(x.refund_amount||0);
   sales-=Number(x.refund_amount||0);
   cost-=cogs;
   if(x.disposition==="Scrap / Damaged")scrapLoss+=Number(x.loss||0);
 });
 data.expenses.forEach(x=>{if(inRange(x.expense_date||x.created_at))expenses+=Number(x.amount||0)});
 return {sales,cost,expenses,refunds,scrapLoss,orders:ordersCount,profit:sales-cost-expenses-scrapLoss};
}

 });

 data.returns.forEach(x=>{
   const d=new Date(x.created_at||"");if(!Number.isFinite(d.getTime())||d<r.from||d>=r.to)return;
   const b=bucket(keyFor(d)),order=data.orders.find(o=>String(o.id)===String(x.order_id)),cogs=order?data.orderCogs(order):0;

function buildOrderReturnBuckets(data,r){
 const span=r.to-r.from,monthly=span>62*86400000,map=new Map();
 const keyFor=d=>monthly?d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"):d.toISOString().slice(0,10);
 const labelFor=k=>monthly?new Date(k+"-01T00:00:00").toLocaleDateString("en-EG",{month:"short",year:"numeric"}):new Date(k+"T00:00:00").toLocaleDateString("en-EG",{day:"2-digit",month:"short"});
 const bucket=k=>{if(!map.has(k))map.set(k,{date:labelFor(k),_key:k,orders:0,returns:0});return map.get(k)};
 data.orders.forEach(o=>{
   const hasReturn=data.returnByOrder.has(String(o.id));
   const eligible=hasReturn?(o.payment_status==="paid"||["confirmed","Completed"].includes(o.order_status)):(!/cancel|failed|return|damaged/i.test(String(o.order_status||"")+" "+String(o.delivery_status||""))&&(o.payment_status==="paid"||["confirmed","Completed"].includes(o.order_status)));
   if(!eligible)return;
   const d=new Date(o.created_at||"");if(!Number.isFinite(d.getTime())||d<r.from||d>=r.to)return;
   bucket(keyFor(d)).orders++;
 });
 data.returns.forEach(x=>{
   const d=new Date(x.created_at||"");if(!Number.isFinite(d.getTime())||d<r.from||d>=r.to)return;
   bucket(keyFor(d)).returns++;
 });
 return [...map.values()].sort((a,b)=>a._key.localeCompare(b._key));
}
function ordersReturnsLineChart(rows,title){
 if(!rows.length)return '<div class="panel"><div class="section-title"><h2>'+esc(title)+'</h2></div><div class="empty">No order data for this period.</div></div>';
 const w=900,h=360,pl=52,pr=24,pt=42,pb=48,plotW=w-pl-pr,plotH=h-pt-pb;
 const max=Math.max(1,...rows.flatMap(x=>[Number(x.orders||0),Number(x.returns||0)])),step=plotH/4;
 const x=i=>pl+(rows.length===1?plotW/2:plotW*i/(rows.length-1)),y=v=>pt+(max-v)/max*plotH;
 const grid=Array.from({length:5},(_,i)=>{const v=Math.round(max*i/4),yy=y(v);return '<line x1="'+pl+'" y1="'+yy+'" x2="'+(w-pr)+'" y2="'+yy+'" class="chart-grid"/><text x="'+(pl-10)+'" y="'+(yy+4)+'" text-anchor="end" class="chart-axis-label">'+v+'</text>'}).join("");
 const line=(key,cls)=>'<polyline points="'+rows.map((r,i)=>x(i)+","+y(Number(r[key]||0))).join(" ")+'" fill="none" class="'+cls+'"/>';
 const dots=(key,cls,label)=>rows.map((r,i)=>'<circle cx="'+x(i)+'" cy="'+y(Number(r[key]||0))+'" r="4" class="'+cls+'"><title>'+esc(r.date)+' — '+esc(label)+': '+Number(r[key]||0)+'</title></circle>').join("");
 const labels=rows.map((r,i)=>{const show=i===0||i===rows.length-1||rows.length<=8||i%Math.ceil(rows.length/8)===0;return show?'<text x="'+x(i)+'" y="'+(h-16)+'" text-anchor="middle" class="chart-axis-label">'+esc(r.date)+'</text>':""}).join("");
 return '<div class="panel profit-chart-panel"><div class="section-title"><div><h2>'+esc(title)+'</h2><div class="muted" style="color:var(--primary);font-weight:700">Orders and returns by date</div></div><div class="chart-legend"><span><i class="legend-dot legend-orders"></i>Orders</span><span><i class="legend-dot legend-returns"></i>Returns</span></div></div><div style="overflow-x:auto"><svg viewBox="0 0 '+w+' '+h+'" style="width:100%;min-width:680px;height:360px;display:block">'+grid+line("orders","orders-line")+line("returns","returns-line")+dots("orders","orders-dot","Orders")+dots("returns","returns-dot","Returns")+labels+'</svg></div></div>';
}
function profitChart(rows,title){
 if(!rows.length)return '<div class="panel"><div class="section-title"><h2>'+esc(title)+'</h2></div><div class="empty">No profit data for this period.</div></div>';
 const w=900,h=360,pl=58,pr=24,pt=42,pb=48,plotW=w-pl-pr,plotH=h-pt-pb;
 const vals=rows.map(x=>Number(x.profit||0)),min=Math.min(0,...vals),max=Math.max(0,...vals),range=max-min||1;
 const zero=pt+(max/range)*plotH;
 const xStep=rows.length===1?plotW:plotW/rows.length;
 const barW=Math.max(12,Math.min(52,xStep*.62));
 const x=i=>pl+i*xStep+(xStep-barW)/2;
 const y=v=>pt+(max-v)/range*plotH;
 const ticks=4;
 const grid=Array.from({length:ticks+1},(_,i)=>{
   const value=max-(range*i/ticks),yy=y(value);
   return '<line x1="'+pl+'" y1="'+yy+'" x2="'+(w-pr)+'" y2="'+yy+'" class="chart-grid"/><text x="'+(pl-10)+'" y="'+(yy+4)+'" text-anchor="end" class="chart-axis-label">'+esc(money(value))+'</text>';
 }).join("");
 const bars=rows.map((r,i)=>{
   const value=Number(r.profit||0),yy=value>=0?y(value):zero,hh=Math.max(2,Math.abs(zero-y(value)));
   return '<rect x="'+x(i)+'" y="'+yy+'" width="'+barW+'" height="'+hh+'" rx="4" class="profit-bar '+(value<0?'profit-bar-loss':'')+'"><title>'+esc(r.date)+' — '+esc(money(value))+'</title></rect>';
 }).join("");
 const labels=rows.map((r,i)=>{
   const show=i===0||i===rows.length-1||rows.length<=8||i%Math.ceil(rows.length/8)===0;
   return show?'<text x="'+(x(i)+barW/2)+'" y="'+(h-16)+'" text-anchor="middle" class="chart-axis-label">'+esc(r.date)+'</text>':"";
 }).join("");
 return '<div class="panel profit-chart-panel"><div class="section-title"><div><h2>'+esc(title)+'</h2><div class="muted" style="color:var(--primary);font-weight:700">Net profit by date</div></div><span class="muted">Green = profit • Red = loss</span></div><div style="overflow-x:auto"><svg viewBox="0 0 '+w+' '+h+'" style="width:100%;min-width:680px;height:360px;display:block">'+grid+'<line x1="'+pl+'" y1="'+zero+'" x2="'+(w-pr)+'" y2="'+zero+'" class="chart-zero"/>'+bars+labels+'</svg></div></div>';
}

 $("#rp").onclick=async()=>{const o=rows.find(x=>x.id===$("#roid").value);if(!o)return;const disposition=forcedDisposition||$("#rd").value;const cogs=(o.order_items||[]).reduce((n,i)=>n+Number(i.quantity||0)*Number(i.cost_price||0),0);try{const result=await api("/api/app/orders/return",{method:"POST",body:JSON.stringify({order_id:o.id,reason:$("#rr").value,disposition,amount:Number(o.total_amount||0),loss:disposition==="Scrap / Damaged"?cogs:0})});if(result.processed===false)throw Error("This order may already have a return or is not eligible.");closeModal();await render()}catch(e){alert(e.message)}}
}

async function reports(c){
