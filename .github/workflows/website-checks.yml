name: Website checks

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Cutdown clothes amr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check server.js
      - run: node --check script.js
