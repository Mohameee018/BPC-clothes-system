<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BPC Clothes System Payment</title><link rel="stylesheet" href="style.css"></head><body><main style="min-height:100vh;display:grid;place-items:center;padding:30px"><section class="glass" style="max-width:620px;padding:50px;border-radius:32px;text-align:center"><p class="eyebrow">CUTDOWN / PAYMENT</p><h1 id="title" style="font-size:clamp(50px,8vw,90px);font-weight:400;line-height:.9">Checking<br>payment.</h1><p id="message" style="font-family:Arial,sans-serif;color:#aaa;line-height:1.7">We are verifying your payment with the payment provider.</p><a class="btn" href="/">Back to store <span>↗</span></a></section></main><script>
(async()=>{const p=new URLSearchParams(location.search),id=p.get("order_id"),title=document.querySelector("#title"),msg=document.querySelector("#message");if(!id){title.innerHTML="Payment<br>status.";msg.textContent="No order reference was provided.";return}for(let i=0;i<6;i++){try{const r=await fetch("/api/payment-status?order_id="+encodeURIComponent(id));const d=await r.json();if(r.ok&&d.payment_status==="paid"){title.innerHTML="Payment<br>confirmed.";msg.textContent="Thank you. Your Cutdown order has been confirmed.";return}if(r.ok&&d.payment_status==="failed"){title.innerHTML="Payment<br>not completed.";msg.textContent="The payment was not confirmed. Your reserved stock has been released.";return}}catch{}await new Promise(x=>setTimeout(x,2000))}title.innerHTML="Payment<br>processing.";msg.textContent="Your payment return was received. We are still waiting for the provider's verified callback. You can check your order from your account.";})();
</script></body></html>
