<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BPC Clothes System — حالة الدفع</title><link rel="stylesheet" href="style.css"><style>body{margin:0;background:#061b10;color:#f7fbf8;font-family:"Readex Pro",Arial,sans-serif;min-height:100vh}.payment-result{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 30% 20%,rgba(57,201,121,.18),transparent 35%),radial-gradient(circle at 80% 80%,rgba(142,233,177,.1),transparent 30%)}.card{width:min(560px,100%);padding:38px;border:1px solid rgba(190,255,214,.16);border-radius:28px;background:rgba(8,43,25,.72);backdrop-filter:blur(24px);text-align:center}h1{font-size:clamp(34px,7vw,56px);margin:0 0 14px;letter-spacing:-.05em}p{color:rgba(247,251,248,.66);line-height:1.8}.status{margin:24px 0;padding:16px;border-radius:14px;background:rgba(57,201,121,.09);border:1px solid rgba(142,233,177,.16)}a{display:inline-block;margin-top:12px;padding:13px 18px;border-radius:13px;background:#39c979;color:#062617;text-decoration:none;font-weight:700}</style></head><body><main class="payment-result"><section class="card"><div style="color:#8ee9b1;letter-spacing:.15em;font-size:11px">BPC CLOTHES SYSTEM · PAYMENT</div><h1 id="title">جارٍ تأكيد الدفع…</h1><p id="copy">بنراجع نتيجة العملية من الخادم، ومش هنعتبر الدفع ناجح لمجرد إن بوابة الدفع رجعتك.</p><div id="status" class="status">جارٍ التحقق…</div><a id="action" href="/plans.html" style="display:none"></a></section></main><script>
const title=document.querySelector("#title"),copy=document.querySelector("#copy"),status=document.querySelector("#status"),action=document.querySelector("#action");const token=sessionStorage.getItem("bpc_signup_token")||sessionStorage.getItem("bpc_admin_token");
async function check(){if(!token){title.textContent="تم الرجوع من الدفع";copy.textContent="لو الدفع تم بنجاح، سجل الدخول بالبريد وكلمة المرور اللي أنشأت بيهم الحساب.";status.textContent="لا توجد جلسة محفوظة.";action.textContent="تسجيل الدخول";action.href="/app.html";action.style.display="inline-block";return true}const r=await fetch("/api/subscription/status",{headers:{Authorization:"Bearer "+token}}).catch(()=>null);const d=r?await r.json().catch(()=>({})):{},s=d.subscription;if(s?.active){sessionStorage.setItem("bpc_admin_token",token);sessionStorage.removeItem("bpc_signup_token");title.textContent="تم الدفع وتفعيل حسابك ✓";copy.textContent="الاشتراك اتفعل بنجاح. جاري فتح BPC Clothes System…";status.textContent="الباقة: "+(s.plan?.name||"اشتراك نشط");setTimeout(()=>location.href="/app.html",700);return true}if(s?.status==="failed"||s?.status==="expired"){title.textContent="لم يتم تفعيل الاشتراك";copy.textContent="لم نثبت عملية دفع ناجحة على الحساب.";status.textContent="تقدر تحاول مرة أخرى أو تتواصل مع الدعم.";action.textContent="العودة للباقات";action.href="/plans.html";action.style.display="inline-block";return true}return false}
(async()=>{for(let i=0;i<15;i++){if(await check())break;status.textContent="لسه بنستنى تأكيد بوابة الدفع… ("+(i+1)+"/15)";await new Promise(x=>setTimeout(x,1200))}})();
</script></body></html>
