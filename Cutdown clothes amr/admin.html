<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cutdown — Admin</title><link rel="stylesheet" href="style.css"></head><body><main style="min-height:100vh;padding:32px"><section class="checkout-card glass" style="max-width:1100px;width:100%;margin:auto"><p class="eyebrow">CUTDOWN ADMIN</p><h1>Orders.</h1><p id="info">Checking access…</p><div style="display:flex;gap:12px;flex-wrap:wrap;margin:18px 0"><a class="btn" href="/">Back to store <span>↗</span></a><button class="btn" id="logout">Sign out <span>→</span></button></div><div id="orders">Loading orders…</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0"></script><script>
(async()=>{const cfg=await fetch("/api/public-config").then(r=>r.json());if(!cfg.supabaseUrl||!cfg.supabaseKey){document.querySelector("#info").textContent="Supabase Auth is not configured.";return}const sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseKey);const s=(await sb.auth.getSession()).data.session;if(!s){location.href="/";return}const h={Authorization:"Bearer "+s.access_token};const ping=await fetch("/api/admin/ping",{headers:h});if(!ping.ok){document.querySelector("#info").textContent="Access denied.";document.querySelector("#logout").onclick=async()=>{await sb.auth.signOut();location.href="/";};return}document.querySelector("#info").textContent="Admin access confirmed.";const load=async()=>{const r=await fetch("/api/admin/orders",{headers:h});const data=await r.json();if(!r.ok){document.querySelector("#orders").textContent=data.error||"Failed to load orders.";return}document.querySelector("#orders").innerHTML=data.length?data.map(o=>'<article style="border:1px solid rgba(255,255,255,.12);padding:18px;margin:12px 0;border-radius:14px"><strong>'+String(o.id)+'</strong><p>'+String(o.customer_name||"")+" · "+String(o.customer_phone||"")+" · "+String(o.total_amount||0)+" EGP</p><p>"+String(o.order_status||"")+" · "+String(o.delivery_status||"")+" · "+String(o.payment_status||"")+'</p><select data-id="'+String(o.id)+'" class="status"><option value="Pending">Pending</option><option value="With Shipping Company">With Shipping Company</option><option value="Out for Delivery">Out for Delivery</option><option value="Delivered">Delivered</option><option value="Returned">Returned</option></select></article>').join(""):"No website orders yet.";data.forEach(o=>{const x=document.querySelector('.status[data-id="'+o.id+'"]');if(x)x.value=o.delivery_status||"Pending";});document.querySelectorAll(".status").forEach(x=>x.onchange=async()=>{const rr=await fetch("/api/admin/orders/status",{method:"POST",headers:{...h,"Content-Type":"application/json"},body:JSON.stringify({order_id:x.dataset.id,delivery_status:x.value})});if(!rr.ok)alert("Could not update order.");});};await load();document.querySelector("#logout").onclick=async()=>{await sb.auth.signOut();location.href="/";};})();
</script></body></html>
