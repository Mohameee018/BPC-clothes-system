<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cutdown — Admin</title><link rel="stylesheet" href="style.css"></head><body><main style="min-height:100vh;display:grid;place-items:center;padding:32px"><section class="checkout-card glass" style="max-width:820px;width:100%"><p class="eyebrow">CUTDOWN ADMIN</p><h1 id="title">Checking access…</h1><p id="info"></p><div style="display:flex;gap:12px;flex-wrap:wrap"><a class="btn" href="/">Back to store <span>↗</span></a><button class="btn" id="logout">Sign out <span>→</span></button></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0"></script><script>
(async()=>{const cfg=await fetch("/api/public-config").then(r=>r.json());const sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseKey);const s=(await sb.auth.getSession()).data.session;if(!s){location.href="/";return}const r=await fetch("/api/admin/ping",{headers:{Authorization:"Bearer "+s.access_token}});if(r.status===403){document.querySelector("#title").textContent="Access denied.";document.querySelector("#info").textContent="This account is a customer account, not an admin account.";document.querySelector("#logout").onclick=async()=>{await sb.auth.signOut();location.href="/";};return}if(!r.ok){await sb.auth.signOut();location.href="/";return}const me=await fetch("/api/auth/me",{headers:{Authorization:"Bearer "+s.access_token}}).then(x=>x.json());document.querySelector("#title").textContent="Admin dashboard.";document.querySelector("#info").textContent=me.user.email||"";document.querySelector("#logout").onclick=async()=>{await sb.auth.signOut();location.href="/";};})();
</script></body></html>
