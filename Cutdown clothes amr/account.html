<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cutdown — Account</title><link rel="stylesheet" href="style.css"></head><body><main style="min-height:100vh;display:grid;place-items:center;padding:32px"><section class="checkout-card glass" style="max-width:720px;width:100%"><p class="eyebrow">CUTDOWN ACCOUNT</p><h1 id="title">Loading account…</h1><p id="info"></p><div style="display:flex;gap:12px;flex-wrap:wrap"><a class="btn" href="/">Back to store <span>↗</span></a><button class="btn" id="logout">Sign out <span>→</span></button></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0"></script><script>
(async()=>{const cfg=await fetch("/api/public-config").then(r=>r.json());const sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseKey);const s=(await sb.auth.getSession()).data.session;if(!s){location.href="/";return}const r=await fetch("/api/auth/me",{headers:{Authorization:"Bearer "+s.access_token}});if(!r.ok){await sb.auth.signOut();location.href="/";return}const d=await r.json();if(d.profile?.role==="admin"){location.href="/admin";return}document.querySelector("#title").textContent="Welcome"+(d.profile?.name?" "+d.profile.name:"")+".";document.querySelector("#info").textContent=d.user.email||"";document.querySelector("#logout").onclick=async()=>{await sb.auth.signOut();location.href="/";};})();
</script></body></html>
