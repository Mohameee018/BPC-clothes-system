<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="description" content="BPC Clothes System — clothing store management system.">
<title>BPC Clothes System</title>
<style>
:root{--bg:#f5f7fb;--panel:#fff;--ink:#172033;--muted:#687386;--line:#e5e9f0;--brand:#111827;--accent:#2563eb;--danger:#dc2626;--ok:#15803d;--shadow:0 12px 32px #1018280d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 10%,#dbeafe,transparent 35%),var(--bg)}.login-card{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;padding:34px;box-shadow:var(--shadow)}.logo{font-weight:900;font-size:25px;letter-spacing:-.8px}.sub{color:var(--muted);margin:6px 0 28px}.field{display:grid;gap:7px;margin:13px 0}.field label{font-weight:700}.field input,.field select,.field textarea{width:100%;border:1px solid #d9dee8;border-radius:10px;padding:11px 12px;outline:none;background:#fff}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px #2563eb14}.btn{padding:10px 14px;border-radius:10px;font-weight:800;background:#eef2f7;color:#1f2937}.btn.primary{background:var(--brand);color:#fff}.btn.blue{background:var(--accent);color:#fff}.btn.danger{background:#fee2e2;color:#991b1b}.btn:disabled{opacity:.5;cursor:not-allowed}.error{color:#b91c1c;margin:10px 0}.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.side{background:#101522;color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh}.brand{padding:8px 10px 25px;font-size:21px;font-weight:900}.brand small{display:block;color:#9ca7b8;font-size:11px;margin-top:4px;font-weight:500}.nav{display:grid;gap:5px}.nav button{background:transparent;color:#b7c0cf;text-align:left;padding:11px 12px;border-radius:9px}.nav button:hover,.nav button.active{background:#202a3b;color:#fff}.side-foot{position:absolute;bottom:20px;left:14px;right:14px;color:#8e99aa;font-size:12px}.main{min-width:0}.top{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}.top h1{font-size:19px;margin:0}.content{padding:28px;max-width:1500px;margin:auto}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.card{padding:18px}.card .num{font-size:28px;font-weight:900;margin-top:7px}.muted{color:var(--muted)}.toolbar{display:flex;gap:9px;align-items:center;justify-content:space-between;margin:20px 0 12px;flex-wrap:wrap}.toolbar .left,.toolbar .right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.search{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;min-width:260px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{text-align:left;padding:12px 13px;border-bottom:1px solid var(--line);vertical-align:middle}.table th{font-size:12px;color:#697386;text-transform:uppercase;letter-spacing:.04em;background:#fafbfc}.table tr:hover td{background:#fbfcfe}.pill{display:inline-flex;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800;background:#dcfce7;color:#166534}.pill.warn{background:#fef3c7;color:#92400e}.pill.bad{background:#fee2e2;color:#991b1b}.empty{padding:40px;text-align:center;color:var(--muted)}.panel{padding:18px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.modal-back{position:fixed;inset:0;background:#11182780;display:grid;place-items:center;padding:20px;z-index:20}.modal{background:#fff;border-radius:18px;width:min(620px,100%);max-height:90vh;overflow:auto;padding:22px}.modal h2{margin-top:0}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px}.statline{display:flex;gap:18px;flex-wrap:wrap}.statline b{font-size:20px}.chart{height:180px;display:flex;align-items:end;gap:8px;padding:20px}.bar{flex:1;background:#2563eb;border-radius:5px 5px 0 0;min-width:8px}.mobile-nav{display:none}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.mobile-nav{display:flex;overflow:auto;background:#101522;padding:7px;gap:5px;position:sticky;top:70px;z-index:4}.mobile-nav button{white-space:nowrap;background:#202a3b;color:#fff;padding:9px 12px;border-radius:8px}.cards{grid-template-columns:1fr 1fr}.content{padding:18px}.grid2{grid-template-columns:1fr}.top{padding:0 18px}}
@media(max-width:560px){.cards{grid-template-columns:1fr}.search{min-width:0;width:100%}}
</style>
</head>
<body>
<section id="login" class="login">
  <form id="loginForm" class="login-card">
    <div class="logo">BPC Clothes System</div>
    <div class="sub">Management system · administrator access</div>
    <div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" required></div>
    <div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div>
    <div id="loginError" class="error"></div>
    <button class="btn primary" style="width:100%">Sign in</button>
  </form>
</section>
<section id="app" class="app hidden">
<aside class="side">
  <div class="brand">BPC Clothes System<small>Clothing business management</small></div>
  <nav id="nav" class="nav"></nav>
  <div class="side-foot"><span id="userName">Administrator</span><br><button id="logout" class="btn" style="margin-top:10px;width:100%">Sign out</button></div>
</aside>
<div class="main">
  <header class="top"><h1 id="pageTitle">Dashboard</h1><span class="muted">BPC Management</span></header>
  <nav id="mobileNav" class="mobile-nav"></nav>
  <main id="content" class="content"></main>
</div>
</section>
<div id="modalBack" class="modal-back hidden"><div id="modal" class="modal"></div></div>
<script>
const $=s=>document.querySelector(s), esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
let token=sessionStorage.getItem("bpc_admin_token")||"",profile=null,current="dashboard",cache={};
const navItems=[["dashboard","Dashboard"],["products","Products"],["inventory","Inventory"],["warehouses","Warehouses"],["customers","Customers"],["orders","Orders"],["returns","Returns"],["expenses","Expenses"],["reports","Reports"],["settings","Settings"]];
function headers(){return {"Content-Type":"application/json",Authorization:"Bearer "+token}}
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{...headers(),...(opt.headers||{})}});let d={};try{d=await r.json()}catch{}if(r.status===401||r.status===403){if(token){sessionStorage.removeItem("bpc_admin_token");token="";showLogin()}throw Error(d.error||"Session expired.")}if(!r.ok)throw Error(d.error||"Request failed.");return d}
function showLogin(){$("#login").classList.remove("hidden");$("#app").classList.add("hidden")}
function showApp(){$("#login").classList.add("hidden");$("#app").classList.remove("hidden")}
function nav(){const h=navItems.map(([id,n])=>'<button data-nav="'+id+'">'+n+"</button>").join("");$("#nav").innerHTML=h;$("#mobileNav").innerHTML=h;document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>go(b.dataset.nav))}
function go(page){current=page;document.querySelectorAll("[data-nav]").forEach(b=>b.classList.toggle("active",b.dataset.nav===page));$("#pageTitle").textContent=navItems.find(x=>x[0]===page)?.[1]||"Dashboard";render()}
function money(v){return "EGP "+Number(v||0).toLocaleString("en-EG",{maximumFractionDigits:2})}
function pill(v){const s=String(v||"—"),bad=/cancel|return|failed|inactive/i.test(s),warn=/pending|prepar|out|shipping/i.test(s);return '<span class="pill '+(bad?"bad":warn?"warn":"")+'">'+esc(s)+"</span>"}
async function render(){
 const c=$("#content");c.innerHTML='<div class="panel">Loading…</div>';
 try{
  if(current==="dashboard")return await dashboard(c);
  if(current==="settings")return settings(c);
  if(current==="reports")return await reports(c);
  if(current==="orders")return await orders(c);
  if(current==="returns")return await returns(c);
  if(current==="products")return await crud(c,"products","Products",["name","sku","category","price","cost_price","stock","minimum_stock","active"]);
  if(current==="inventory")return await inventory(c);
  if(current==="warehouses")return await crud(c,"warehouses","Warehouses",["name","location","active"]);
  if(current==="customers")return await crud(c,"customers","Customers",["name","phone","email","city","address","status"]);
  if(current==="expenses")return await crud(c,"expenses","Expenses",["amount","category","description","payment_method","status","expense_date"]);
 }catch(e){c.innerHTML='<div class="panel error">'+esc(e.message)+'</div>'}
}
async function dashboard(c){
 const d=await api("/api/system/summary");cache.summary=d;
 c.innerHTML='<div class="cards">'+[
 ["Products",d.counts.products],["Inventory rows",d.counts.inventory],["Customers",d.counts.customers],["Orders",d.counts.orders]
 ].map(x=>'<div class="card"><div class="muted">'+x[0]+'</div><div class="num">'+Number(x[1]||0).toLocaleString()+'</div></div>').join("")+
 '<div class="card"><div class="muted">Sales excluding cancelled</div><div class="num">'+money(d.revenue)+'</div></div></div>'+
 '<div class="grid2" style="margin-top:16px"><div class="panel"><div class="section-title"><h2>System modules</h2></div><div class="statline">'+navItems.slice(1,-1).map(x=>'<button class="btn" data-quick="'+x[0]+'">'+x[1]+'</button>').join("")+'</div></div><div class="panel"><h2>Desktop parity scope</h2><p class="muted">Products, inventory, warehouses, customers, orders, whole-order returns, expenses, dashboard and reports are represented here. Data is tenant-scoped to the signed-in BPC administrator.</p></div></div>';
 c.querySelectorAll("[data-quick]").forEach(b=>b.onclick=()=>go(b.dataset.quick));
}
async function crud(c,table,title,fields){
 const rows=await api("/api/system/"+table+"?limit=300");cache[table]=rows;
 const search=document.createElement("input");search.className="search";search.placeholder="Search "+title.toLowerCase()+"…";
 c.innerHTML=`<div class="toolbar"><div class="left"><input id="searchBox" class="search" placeholder="Search ${title.toLowerCase()}…"></div><div class="right"><button class="btn blue" id="addBtn">+ Add ${title.replace(/s$/,"")}</button></div></div><div class="panel"><div class="table-wrap"><table class="table"><thead><tr>${fields.map(f=>"<th>"+f.replaceAll("_"," ")+"</th>").join("")}<th></th></tr></thead><tbody id="rows"></tbody></table></div></div>`;
 const draw=term=>{$("#rows").innerHTML=rows.filter(x=>JSON.stringify(x).toLowerCase().includes(term.toLowerCase())).map(x=>"<tr>"+fields.map(f=>"<td>"+(f==="price"||f==="cost_price"||f==="amount"||f==="total_spent"?money(x[f]):f==="active"||f==="is_active"?pill(x[f]?"Active":"Inactive"):esc(x[f]??"—"))+"</td>").join("")+'<td><button class="btn" data-edit="'+esc(x.id)+'">Edit</button> <button class="btn danger" data-del="'+esc(x.id)+'">Delete</button></td></tr>').join("")||'<tr><td colspan="'+(fields.length+1)+'" class="empty">No records.</td></tr>'};
 draw("");$("#searchBox").oninput=e=>draw(e.target.value);$("#addBtn").onclick=()=>formModal(table,title,fields,null);
 c.querySelector("#rows").onclick=e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.edit)formModal(table,title,fields,rows.find(x=>x.id===b.dataset.edit));if(b.dataset.del)removeRow(table,b.dataset.del)};
}
async function removeRow(table,id){if(!confirm("Delete this record?"))return;try{await api("/api/system/"+table+"/"+id,{method:"DELETE"});await render()}catch(e){alert(e.message)}}
function formModal(table,title,fields,row){
 const controls=fields.map(f=>{const v=row?.[f]??"";if(["active","is_active"].includes(f))return '<label class="field"><span>'+f+'</span><select name="'+f+'"><option value="true" '+(v!==false?"selected":"")+'>Active</option><option value="false" '+(v===false?"selected":"")+'>Inactive</option></select></label>';const type=["price","cost_price","amount","total_spent","stock","minimum_stock","total_orders"].includes(f)?"number":f.includes("date")?"date":"text";return '<label class="field"><span>'+f.replaceAll("_"," ")+'</span><input name="'+f+'" type="'+type+'" value="'+esc(v)+'" '+(["price","cost_price","amount","stock","minimum_stock","total_orders"].includes(f)?'step="0.01"':'')+'></label>'}).join("");
 $("#modal").innerHTML='<h2>'+(row?"Edit ":"Add ")+title.replace(/s$/,"")+'</h2><form id="recordForm">'+controls+'<div class="modal-actions"><button type="button" class="btn" id="cancelModal">Cancel</button><button class="btn blue">Save</button></div></form>';$("#modalBack").classList.remove("hidden");$("#cancelModal").onclick=closeModal;
 $("#recordForm").onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.currentTarget),body={};fields.forEach(f=>{let v=fd.get(f);if(["active","is_active"].includes(f))v=v==="true";else if(["price","cost_price","amount","stock","minimum_stock","total_orders","total_spent"].includes(f))v=v===""?0:Number(v);body[f]=v});try{await api("/api/system/"+table+(row?"/"+row.id:""),{method:row?"PATCH":"POST",body:JSON.stringify(body)});closeModal();await render()}catch(e){alert(e.message)}}
}
function closeModal(){$("#modalBack").classList.add("hidden")}
$("#modalBack").onclick=e=>{if(e.target.id==="modalBack")closeModal()}
async function inventory(c){
 const [items,products,warehouses]=await Promise.all([api("/api/system/inventory?limit=500"),api("/api/system/products?limit=500"),api("/api/system/warehouses?limit=100")]);const pm=new Map(products.map(x=>[x.id,x])),wm=new Map(warehouses.map(x=>[x.id,x]));
 c.innerHTML='<div class="toolbar"><div class="left"><input id="invSearch" class="search" placeholder="Search product, warehouse, variant…"></div></div><div class="panel"><div class="table-wrap"><table class="table"><thead><tr><th>Product</th><th>Variant</th><th>Warehouse</th><th>Quantity</th><th>Updated</th></tr></thead><tbody id="rows"></tbody></table></div></div>';
 const draw=t=>$("#rows").innerHTML=items.filter(i=>JSON.stringify({...i,product:pm.get(i.product_id)?.name,warehouse:wm.get(i.warehouse_id)?.name}).toLowerCase().includes(t.toLowerCase())).map(i=>'<tr><td><b>'+esc(pm.get(i.product_id)?.name||"Unknown")+'</b></td><td>'+esc((i.variant_id||"Base stock"))+'</td><td>'+esc(wm.get(i.warehouse_id)?.name||"Unknown")+'</td><td>'+pill(Number(i.quantity||0)<=0?"0":String(i.quantity))+'</td><td>'+esc(i.updated_at||"—")+'</td></tr>').join("")||'<tr><td colspan="5" class="empty">No inventory records.</td></tr>';draw("");$("#invSearch").oninput=e=>draw(e.target.value);
}
async function orders(c){
 const rows=await api("/api/admin/orders");cache.orders=rows;
 c.innerHTML='<div class="toolbar"><input id="orderSearch" class="search" placeholder="Search order, customer, phone…"></div><div class="panel"><div class="table-wrap"><table class="table"><thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Payment</th><th>Order status</th><th>Delivery</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div>';
 const draw=t=>$("#rows").innerHTML=rows.filter(o=>JSON.stringify(o).toLowerCase().includes(t.toLowerCase())).map(o=>'<tr><td><b>'+esc(o.id?.slice(0,8))+'</b><div class="muted">'+esc(o.created_at||"")+'</div></td><td>'+esc(o.customer_name)+'<br><span class="muted">'+esc(o.customer_phone)+'</span></td><td>'+money(o.total_amount)+'</td><td>'+pill(o.payment_status)+'</td><td>'+pill(o.order_status)+'</td><td>'+pill(o.delivery_status)+'</td><td><button class="btn" data-order="'+esc(o.id)+'">Update</button></td></tr>').join("")||'<tr><td colspan="7" class="empty">No orders.</td></tr>';
 draw("");$("#orderSearch").oninput=e=>draw(e.target.value);$("#rows").onclick=e=>{const b=e.target.closest("[data-order]");if(b)orderModal(rows.find(x=>x.id===b.dataset.order))}
}
function orderModal(o){$("#modal").innerHTML='<h2>Order '+esc(o.id?.slice(0,8))+'</h2><p><b>'+esc(o.customer_name)+'</b> · '+esc(o.customer_phone)+'</p><p>Total: <b>'+money(o.total_amount)+'</b></p><div class="grid2"><label class="field">Order status<select id="os"><option>Not Prepared</option><option>Preparing</option><option>Prepared</option><option>Completed</option></select></label><label class="field">Delivery status<select id="ds"><option>Pending</option><option>With Shipping Company</option><option>Out for Delivery</option><option>Delivered</option><option>Returned</option></select></label></div><div class="modal-actions"><button class="btn" id="cancelModal">Cancel</button><button class="btn blue" id="saveOrder">Save</button></div>';$("#modalBack").classList.remove("hidden");$("#os").value=o.order_status==="confirmed"?"Completed":o.order_status||"Not Prepared";$("#ds").value=o.delivery_status||"Pending";$("#cancelModal").onclick=closeModal;$("#saveOrder").onclick=async()=>{try{await api("/api/admin/orders/status",{method:"POST",body:JSON.stringify({order_id:o.id,order_status:$("#os").value,delivery_status:$("#ds").value})});closeModal();await render()}catch(e){alert(e.message)}}
async function returns(c){
 const rows=(await api("/api/desktop/orders")).filter(o=>o.order_status==="confirmed"||o.order_status==="Completed");cache.returns=rows;
 c.innerHTML='<div class="toolbar"><div class="left"><span class="muted">Whole-order return workflow, matching the desktop system.</span></div></div><div class="panel"><div class="table-wrap"><table class="table"><thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th><th></th></tr></thead><tbody>'+rows.map(o=>'<tr><td>'+esc(o.id?.slice(0,8))+'</td><td>'+esc(o.customer_name)+'</td><td>'+money(o.total_amount)+'</td><td>'+pill(o.order_status)+'</td><td><button class="btn danger" data-ret="'+esc(o.id)+'">Process return</button></td></tr>').join("")+'</tbody></table></div></div>';
 c.querySelectorAll("[data-ret]").forEach(b=>b.onclick=()=>returnModal(rows.find(o=>o.id===b.dataset.ret)));
}
function returnModal(o){$("#modal").innerHTML='<h2>Whole-order return</h2><p>Order <b>'+esc(o.id?.slice(0,8))+'</b> · '+money(o.total_amount)+'</p><label class="field">Reason<input id="rr" value="Customer Return"></label><label class="field">Disposition<select id="rd"><option>Return to Stock</option><option>Damaged</option><option>Loss</option></select></label><div class="modal-actions"><button class="btn" id="cancelModal">Cancel</button><button class="btn danger" id="doReturn">Process return</button></div>';$("#modalBack").classList.remove("hidden");$("#cancelModal").onclick=closeModal;$("#doReturn").onclick=async()=>{if(!confirm("Process this whole-order return?"))return;try{await api("/api/desktop/orders/return",{method:"POST",body:JSON.stringify({order_id:o.id,reason:$("#rr").value,disposition:$("#rd").value,amount:Number(o.total_amount||0),loss:$("#rd").value==="Loss"?Number(o.total_amount||0):0})});closeModal();await render()}catch(e){alert(e.message)}}
async function reports(c){
 const [orders,expenses]=await Promise.all([api("/api/system/orders?limit=500"),api("/api/system/expenses?limit=500")]);const valid=orders.filter(o=>!String(o.order_status||"").toLowerCase().includes("cancel"));const sales=valid.reduce((n,o)=>n+Number(o.total_amount||0),0),cost=orders.flatMap(o=>[]).reduce((n,x)=>n+Number(x.cost_price||0)*Number(x.quantity||0),0),ex=expenses.reduce((n,x)=>n+Number(x.amount||0),0);
 c.innerHTML='<div class="cards"><div class="card"><div class="muted">Net sales</div><div class="num">'+money(sales)+'</div></div><div class="card"><div class="muted">Expenses</div><div class="num">'+money(ex)+'</div></div><div class="card"><div class="muted">Orders</div><div class="num">'+valid.length+'</div></div><div class="card"><div class="muted">Sales minus expenses</div><div class="num">'+money(sales-ex)+'</div></div></div><div class="panel" style="margin-top:16px"><h2>Report basis</h2><p class="muted">Cancelled orders are excluded from sales, matching the desktop reporting rule. Cost-of-goods and return reconciliation will use stored order-item snapshots as the migration is completed.</p></div>';
}
function settings(c){c.innerHTML='<div class="grid2"><div class="panel"><h2>Account</h2><p>'+esc(profile?.name||"Administrator")+'</p><p class="muted">'+esc(profile?.email||"")+'</p></div><div class="panel"><h2>Security</h2><p class="muted">Tenant scope is derived server-side from the authenticated administrator profile. The browser never receives the service-role key.</p><button class="btn danger" id="logout2">Sign out</button></div></div>';$("#logout2").onclick=logout}
async function logout(){sessionStorage.removeItem("bpc_admin_token");token="";profile=null;showLogin()}
$("#logout").onclick=logout;
$("#loginForm").onsubmit=async e=>{e.preventDefault();$("#loginError").textContent="";try{const d=await fetch("/api/desktop/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:$("#email").value.trim(),password:$("#password").value})}).then(async r=>{const x=await r.json().catch(()=>({}));if(!r.ok)throw Error(x.error||"Sign in failed.");return x});token=d.access_token;profile=d.profile;sessionStorage.setItem("bpc_admin_token",token);$("#userName").textContent=profile?.name||profile?.email||"Administrator";showApp();nav();go("dashboard")}catch(e){$("#loginError").textContent=e.message}};
(async()=>{nav();if(!token){showLogin();return}try{const d=await api("/api/auth/me");profile=d.profile||{};$("#userName").textContent=profile.name||profile.email||"Administrator";showApp();go("dashboard")}catch{showLogin()}})();
</script>
</body>
</html>
