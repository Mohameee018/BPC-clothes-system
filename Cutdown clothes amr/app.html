<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive"><title>BPC Clothes System</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8faf9;--side:#0a2d2d;--side2:#103c3a;--text:#263737;--muted:#8a9696;--line:#e1e8e6;--white:#fff;--primary:#197369;--primary2:#1d8178;--danger:#b84b4b;--warn:#b77a20;--shadow:0 8px 28px rgba(22,45,45,.06)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 "Readex Pro",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:#061b10;position:relative;overflow:hidden}.login:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(3,24,14,.94),rgba(4,38,21,.72)),url("assets/model t shirt.png") center/cover no-repeat}.login-card{position:relative;z-index:2;width:min(470px,100%);padding:34px;border:1px solid rgba(190,255,214,.18);border-radius:26px;background:rgba(7,35,21,.72);backdrop-filter:blur(20px);box-shadow:0 28px 90px rgba(0,0,0,.3);color:#f7fbf8}.login-card .logo{font:600 30px Oswald}.login-card .sub{color:rgba(247,251,248,.58);margin:6px 0 28px}.field{display:grid;gap:7px;margin:12px 0}.field input,.field select,.field textarea{width:100%;border:1px solid #d7e1df;border-radius:10px;padding:10px 11px;outline:0;background:#fff;color:#172525}.login-card .field input{border-color:rgba(255,255,255,.14)}.btn{border:0;border-radius:9px;padding:9px 13px;background:#eef2f2;color:#394646;font-weight:700}.btn.primary,.btn.blue{background:var(--primary);color:#fff}.btn.primary:hover,.btn.blue:hover{background:var(--primary2)}.btn.danger{background:#f8e2e2;color:#963f3f}.btn.warn{background:#fff0d1;color:#8c6218}.error{color:#e99b9b;margin:10px 0}.login-links{display:grid;gap:9px;margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,.1);text-align:center;font-size:12px}.login-links a{color:rgba(247,251,248,.62);text-decoration:none}.login-links b{color:#8ee9b1}
.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.side{background:var(--side);color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh}.brand{padding:8px 10px 20px;font:600 22px Oswald}.brand small{display:block;color:#8fa7a4;font:500 11px "Readex Pro";margin-top:4px}.section{font:600 10px Oswald;color:#7da09b;letter-spacing:.16em;padding:12px 10px 7px}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:#b9c7c5;text-align:left;padding:10px 12px;border-radius:9px}.nav button:hover,.nav button.active{background:var(--side2);color:#fff}.side-foot{position:absolute;bottom:18px;left:14px;right:14px;color:#91a4a1;font-size:12px}
.main{min-width:0}.top{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}.top h1{font:700 22px Oswald;margin:0}.content{padding:28px;max-width:1600px;margin:auto}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.cards.five{grid-template-columns:repeat(5,minmax(0,1fr))}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.card{padding:17px}.card .num{font:700 24px Oswald;margin-top:7px}.muted{color:var(--muted)}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:0 0 14px;flex-wrap:wrap}.toolbar .left,.toolbar .right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.search{border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 12px;min-width:280px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:900px}.table th,.table td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}.table th{font-size:11px;color:#687777;text-transform:uppercase;letter-spacing:.04em;background:#f5f8f7}.table tr:hover td{background:#fbfdfc}.pill{display:inline-flex;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800;background:#dff2e7;color:#31704b}.pill.warn{background:#fff0d1;color:#8a6119}.pill.bad{background:#f8dfdf;color:#9a4141}.empty{padding:35px;text-align:center;color:var(--muted)}.panel{padding:18px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.modal-back{position:fixed;inset:0;background:#10202080;display:grid;place-items:center;padding:20px;z-index:20}.modal{background:#fff;border-radius:16px;width:min(720px,100%);max-height:92vh;overflow:auto;padding:24px}.modal h2{font:700 22px Oswald;margin:0 0 16px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px}.section-title h2{font:700 19px Oswald}.statline{display:flex;gap:8px;flex-wrap:wrap}.thumb{width:48px;height:48px;border-radius:8px;object-fit:cover;background:#eef3f1;border:1px solid var(--line)}.mobile-nav{display:none}
@media(max-width:1050px){.cards.five{grid-template-columns:repeat(3,1fr)}.cards{grid-template-columns:repeat(2,1fr)}.app{grid-template-columns:210px 1fr}.grid2,.grid3{grid-template-columns:1fr}}
@media(max-width:720px){.app{grid-template-columns:1fr}.side{display:none}.mobile-nav{display:flex;overflow:auto;background:var(--side);padding:7px;gap:5px;position:sticky;top:70px;z-index:4}.mobile-nav button{white-space:nowrap;background:var(--side2);color:#fff;padding:8px 11px;border-radius:8px;border:0}.content{padding:16px}.cards,.cards.five{grid-template-columns:1fr}.top{padding:0 16px}.search{min-width:0;width:100%}}
</style>
</head>
<body>
<section id="login" class="login">
<form id="loginForm" class="login-card">
<div class="logo">BPC Clothes System</div><div class="sub">Management system · administrator access</div>
<div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" required></div>
<div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div>
<div id="loginError" class="error"></div><button class="btn primary" style="width:100%">Sign in</button>
<div class="login-links"><a href="/plans.html">مش معاك أكونت؟ <b>اشترك الآن</b></a><a href="/signup.html">عندي كود تفعيل · <b>إنشاء الحساب</b></a><a href="https://wa.me/201080910753" target="_blank">الدفع أونلاين غير متاح؟ <b>تواصل مع الدعم</b></a></div>
</form></section>
<section id="app" class="app hidden">
<aside class="side"><div class="brand">BPC Clothes System<small>Clothing business management</small></div>
<div class="section">MAIN</div><nav id="nav" class="nav"></nav><div class="section">MANAGEMENT</div><nav id="nav2" class="nav"></nav>
<div class="side-foot"><span id="userName">Administrator</span><br><button id="logout" class="btn" style="margin-top:9px;width:100%">Sign out</button></div></aside>
<div class="main"><header class="top"><h1 id="pageTitle">Dashboard</h1><div style="text-align:right"><span class="muted">BPC Management</span><div id="subscriptionBadge"></div></div></header><nav id="mobileNav" class="mobile-nav"></nav><div id="subscriptionWarning" class="hidden" style="margin:14px 18px 0;padding:13px;border:1px solid #e8c77e;border-radius:10px;background:#fff7df"></div><main id="content" class="content"></main></div>
</section>
<div id="modalBack" class="modal-back hidden"><div id="modal" class="modal"></div></div>
<script>
const $=s=>document.querySelector(s),esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])),money=v=>"EGP "+Number(v||0).toLocaleString("en-EG",{maximumFractionDigits:2});
let token=sessionStorage.getItem("bpc_admin_token")||"",profile=null,tenantBrand=null,current="dashboard",cache={};
const mainNav=[["dashboard","Dashboard"],["products","Products"],["inventory","Inventory"],["orders","Orders"],["customers","Customers"]];
const managementNav=[["returns","Returns"],["expenses","Expenses"],["reports","Reports"],["settings","Settings"]];
const navItems=[...mainNav,...managementNav];
function headers(){return {"Content-Type":"application/json",Authorization:"Bearer "+token}}
function storefrontUrl(){if(tenantBrand?.website_url)return tenantBrand.website_url;return "https://bpc-clothes-system-production.up.railway.app/store?brand="+encodeURIComponent(tenantBrand?.slug||"cutdown-default")}
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{...headers(),...(opt.headers||{})}});let d={};try{d=await r.json()}catch{}if(r.status===401||r.status===403){if(token){sessionStorage.removeItem("bpc_admin_token");token="";showLogin()}throw Error(d.error||"Session expired.")}if(!r.ok)throw Error(d.error||"Request failed.");return d}
function showLogin(){$("#login").classList.remove("hidden");$("#app").classList.add("hidden")}
function showApp(){$("#login").classList.add("hidden");$("#app").classList.remove("hidden")}
function nav(){const make=items=>items.map(([id,n])=>'<button data-nav="'+id+'">'+n+"</button>").join("");$("#nav").innerHTML=make(mainNav);$("#nav2").innerHTML=make(managementNav);$("#mobileNav").innerHTML=make(navItems);document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>go(b.dataset.nav))}
function go(page){current=page;document.querySelectorAll("[data-nav]").forEach(b=>b.classList.toggle("active",b.dataset.nav===page));$("#pageTitle").textContent=navItems.find(x=>x[0]===page)?.[1]||"Dashboard";render()}
function pill(v){const s=String(v||"—"),bad=/cancel|return|failed|inactive|damaged/i.test(s),warn=/pending|prepar|out|shipping/i.test(s);return '<span class="pill '+(bad?"bad":warn?"warn":"")+'">'+esc(s)+"</span>"}
function renderSubscription(sub){const el=$("#subscriptionBadge"),warn=$("#subscriptionWarning");if(!sub){el.innerHTML="";return}const date=sub.expires_at?new Date(sub.expires_at).toLocaleString("ar-EG",{dateStyle:"medium",timeStyle:"short"}):"—";el.innerHTML='<div style="font-size:11px;margin-top:3px">'+esc(sub.plan?.name||"Subscription")+" · "+esc(date)+"</div>";if(sub.warning){warn.classList.remove("hidden");warn.innerHTML="⚠️ اشتراكك قرب يخلص — "+esc(date)}}
async function render(){const c=$("#content");c.innerHTML='<div class="panel">Loading…</div>';try{if(current==="dashboard")return dashboard(c);if(current==="products")return products(c);if(current==="inventory")return inventory(c);if(current==="orders")return orders(c);if(current==="customers")return crud(c,"customers","Customers",["name","phone","email","city","address","status","total_orders","total_spent"]);if(current==="returns")return returns(c);if(current==="expenses")return expenses(c);if(current==="reports")return reports(c);if(current==="settings")return settings(c)}catch(e){c.innerHTML='<div class="panel error" style="color:#a94444">'+esc(e.message)+'</div>'}}
async function dashboard(c){const d=await api("/api/system/summary");c.innerHTML='<div class="cards five">'+[["Total Sales",money(d.revenue)],["Products",d.counts.products],["Inventory",d.counts.inventory],["Customers",d.counts.customers],["Orders",d.counts.orders]].map(x=>'<div class="card"><div class="muted">'+x[0]+'</div><div class="num">'+x[1]+'</div></div>').join("")+'</div><div class="grid2" style="margin-top:16px"><div class="panel"><div class="section-title"><h2>System modules</h2></div><div class="statline">'+navItems.slice(1).map(x=>'<button class="btn" data-q="'+x[0]+'">'+x[1]+'</button>').join("")+'</div></div><div class="panel"><div class="section-title"><h2>Business overview</h2></div><p class="muted">Web version follows the desktop system structure: Products, Inventory, Orders, Customers, Returns, Expenses, Reports and Settings.</p></div></div>';c.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>go(b.dataset.q))}
function table(rows,fields,actions=true){return '<div class="panel"><div class="table-wrap"><table class="table"><thead><tr>'+fields.map(f=>'<th>'+(f==="adjust"?"Action":f.replaceAll("_"," "))+"</th>").join("")+(actions?"<th></th>":"")+'</tr></thead><tbody>'+rows.map(x=>'<tr>'+fields.map(f=>'<td>'+((f==="price"||f==="cost_price"||f==="amount"||f==="total_spent"||f==="total_amount"||f==="sales"||f==="expenses"||f==="returns"||f==="discount"||f==="shipping_amount"||f==="refund_amount")?money(x[f]):(f==="active"||f==="is_active"?pill(x[f]?"Active":"Inactive"):(f==="adjust"?'<button class="btn" data-adjust="'+esc(x.id)+'">Adjust Stock</button>':esc(x[f]??"—"))))+"</td>").join("")+(actions?'<td><button class="btn" data-edit="'+esc(x.id)+'">Edit</button> <button class="btn danger" data-del="'+esc(x.id)+'">Delete</button></td>':"")+"</tr>").join("")||'<tr><td colspan="'+(fields.length+(actions?1:0))+'" class="empty">No records.</td></tr></tbody></table></div></div>'}
async function crud(c,resource,title,fields){const rows=await api("/api/system/"+resource+"?limit=500");cache[resource]=rows;c.innerHTML='<div class="toolbar"><div class="left"><input id="search" class="search" placeholder="Search '+title+'…"></div><div class="right"><button class="btn blue" id="add">+ New '+title.replace(/s$/,"")+'</button></div></div><div id="table"></div>';const draw=t=>{$("#table").innerHTML=table(rows.filter(x=>JSON.stringify(x).toLowerCase().includes(t.toLowerCase())),fields)};draw("");$("#search").oninput=e=>draw(e.target.value);$("#add").onclick=()=>formModal(resource,title,fields,null);$("#table").onclick=e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.edit)formModal(resource,title,fields,rows.find(x=>x.id===b.dataset.edit));if(b.dataset.del)removeRow(resource,b.dataset.del)}}
async function removeRow(resource,id){if(!confirm("Delete this record?"))return;try{await api("/api/system/"+resource+"/"+id,{method:"DELETE"});await render()}catch(e){alert(e.message)}}
function closeModal(){$("#modalBack").classList.add("hidden")}$("#modalBack").onclick=e=>{if(e.target.id==="modalBack")closeModal()}
function formModal(resource,title,fields,row){const controls=fields.map(f=>{const v=row?.[f]??"";if(["active","is_active"].includes(f))return '<label class="field"><span>'+f+'</span><select name="'+f+'"><option value="true" '+(v!==false?"selected":"")+'>Active</option><option value="false" '+(v===false?"selected":"")+'>Inactive</option></select></label>';const type=["price","cost_price","amount","stock","minimum_stock","total_orders","total_spent"].includes(f)?"number":f.includes("date")?"date":"text";return '<label class="field"><span>'+f.replaceAll("_"," ")+'</span><input name="'+f+'" type="'+type+'" value="'+esc(v)+'"></label>'}).join("");$("#modal").innerHTML='<h2>'+(row?"Edit ":"New ")+title.replace(/s$/,"")+'</h2><form id="f">'+controls+'<div class="modal-actions"><button type="button" class="btn" id="cancel">Cancel</button><button class="btn blue">Save</button></div></form>';$("#modalBack").classList.remove("hidden");$("#cancel").onclick=closeModal;$("#f").onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.currentTarget),body={};fields.forEach(f=>{let v=fd.get(f);if(["active","is_active"].includes(f))v=v==="true";else if(["price","cost_price","amount","stock","minimum_stock","total_orders","total_spent"].includes(f))v=v===""?0:Number(v);body[f]=v});try{await api("/api/system/"+resource+(row?"/"+row.id:""),{method:row?"PATCH":"POST",body:JSON.stringify(body)});closeModal();await render()}catch(e){if(saved&&!row){closeModal();await render();alert("Product was saved, but a follow-up step failed: "+e.message)}else alert(e.message)}}}
async function products(c){const [rows,variants]=await Promise.all([api("/api/system/products?limit=500"),api("/api/system/product_variants?limit=500")]);rows.forEach(p=>{p.variants=variants.filter(v=>v.product_id===p.id);p.variant_preview=p.variants.map(v=>v.size||"One Size").join(", ");p.color=p.variants.map(v=>v.color).filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i).join(", ")});cache.products=rows;c.innerHTML='<div class="toolbar"><div class="left"><input id="ps" class="search" placeholder="Search by name, SKU or category"></div><div class="right"><a class="btn" id="storefrontLink" href="'+esc(storefrontUrl())+'" target="_blank" rel="noopener">View Storefront ↗</a><button class="btn blue" id="addProduct">+ Add Product</button></div></div><div class="panel"><div class="table-wrap"><table class="table"><thead><tr><th>Image</th><th>Product ID</th><th>SKU</th><th>Product Name</th><th>Category</th><th>Size</th><th>Color</th><th>Selling Price</th><th>Cost Price</th><th>Stock</th><th>Status</th><th>Action</th></tr></thead><tbody id="pr"></tbody></table></div></div>';const draw=t=>{$("#pr").innerHTML=rows.filter(x=>[x.name,x.sku,x.category,x.slug].join(" ").toLowerCase().includes(t.toLowerCase())).map(x=>'<tr><td>'+(x.image_url?'<img class="thumb" src="'+esc(x.image_url)+'">':'—')+'</td><td>'+esc(x.desktop_id||x.id.slice(0,8))+'</td><td>'+esc(x.sku)+'</td><td><b>'+esc(x.name)+'</b></td><td>'+esc(x.category)+'</td><td>'+esc(x.variant_preview||"One Size")+'</td><td>'+esc(x.color||"—")+'</td><td>'+money(x.price)+'</td><td>'+money(x.cost_price)+'</td><td>'+esc(x.stock)+'</td><td>'+pill(x.active?"Active":"Inactive")+'</td><td><button class="btn" data-edit="'+x.id+'">Edit</button> <button class="btn '+(x.active?"danger":"blue")+'" data-toggle="'+x.id+'">'+(x.active?"Deactivate":"Activate")+'</button></td></tr>').join("")||'<tr><td colspan="12" class="empty">No products.</td></tr>'};draw("");$("#ps").oninput=e=>draw(e.target.value);$("#addProduct").onclick=()=>productModal(null);$("#pr").onclick=e=>{const b=e.target.closest("button");if(!b)return;const row=rows.find(x=>x.id===b.dataset.edit||x.id===b.dataset.toggle);if(b.dataset.edit)productModal(row);if(b.dataset.toggle)toggleProduct(row)}}
async function uploadProductImage(file,productId){if(!file)return null;if(file.size>1572864)throw Error("Image must be smaller than 1.5 MB.");const encoded=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result||"").split(",").pop());reader.onerror=()=>reject(Error("Could not read image file."));reader.readAsDataURL(file)});return api("/api/app/product-image",{method:"POST",body:JSON.stringify({product_id:productId,data_base64:encoded})})}
function productModal(row){const v=row||{};$("#modal").innerHTML='<h2>'+(row?"Edit Product":"Add New Product")+'</h2><div class="grid2"><label class="field"><span>SKU</span><input id="sku" value="'+esc(v.sku||"")+'"></label><label class="field"><span>Product Name</span><input id="pn" value="'+esc(v.name||"")+'"></label><label class="field"><span>Category</span><input id="pc" value="'+esc(v.category||"")+'"></label><label class="field"><span>Selling Price</span><input id="pp" type="number" step="0.01" value="'+esc(v.price||0)+'"></label><label class="field"><span>Cost Price</span><input id="cp" type="number" step="0.01" value="'+esc(v.cost_price||0)+'"></label><label class="field"><span>Stock</span><input id="psk" type="number" value="'+esc(v.stock||0)+'"></label><label class="field"><span>Minimum Stock</span><input id="pmin" type="number" value="'+esc(v.minimum_stock||0)+'"></label><label class="field"><span>Size</span><input id="size" value="'+esc(v.variants?.[0]?.size||"")+'" '+(row?'disabled':'')+'></label><label class="field"><span>Color</span><input id="color" value="'+esc(v.variants?.[0]?.color||"")+'" '+(row?'disabled':'')+'></label><label class="field"><span>Image URL (optional)</span><input id="img" value="'+esc(v.image_url||"")+'"></label><label class="field"><span>Upload Image (JPG / PNG / WebP, max 1.5 MB)</span><input id="imgFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></label></div><label class="field"><span>Description</span><textarea id="desc" rows="3">'+esc(v.description||"")+'</textarea></label><label class="field"><span>Website</span><select id="active"><option value="true" '+(v.active!==false?"selected":"")+'>Published / Active</option><option value="false" '+(v.active===false?"selected":"")+'>Not published / Inactive</option></select></label><div class="modal-actions"><button class="btn" id="cancel">Cancel</button><button class="btn blue" id="save">Save Product</button></div>';$("#modalBack").classList.remove("hidden");$("#cancel").onclick=closeModal;$("#save").onclick=async()=>{const body={sku:$("#sku").value.trim(),name:$("#pn").value.trim(),category:$("#pc").value.trim(),price:Number($("#pp").value||0),cost_price:Number($("#cp").value||0),stock:(!row&&($("#size").value.trim()||$("#color").value.trim()))?0:Number($("#psk").value||0),minimum_stock:Number($("#pmin").value||0),description:$("#desc").value.trim(),image_url:$("#img").value.trim(),active:$("#active").value==="true",is_active:$("#active").value==="true"};let saved=null;try{const file=$("#imgFile").files[0];if(row){if(file){const uploaded=await uploadProductImage(file,row.id);body.image_url=uploaded.image_url}saved=await api("/api/system/products/"+row.id,{method:"PATCH",body:JSON.stringify(body)})}else{saved=await api("/api/system/products",{method:"POST",body:JSON.stringify(body)});if(file)await uploadProductImage(file,saved.id)}if(!row&&($("#size").value.trim()||$("#color").value.trim()))await api("/api/system/product_variants",{method:"POST",body:JSON.stringify({product_id:saved.id,sku:body.sku,size:$("#size").value.trim(),color:$("#color").value.trim(),stock:Number($("#psk").value||0),active:true})});closeModal();await render()}catch(e){alert(e.message)}}}
async function toggleProduct(row){try{await api("/api/system/products/"+row.id,{method:"PATCH",body:JSON.stringify({active:!row.active,is_active:!row.active})});await render()}catch(e){alert(e.message)}}

async function reports(c){
 const [orders,expenses,products,returns]=await Promise.all([api("/api/admin/orders"),api("/api/system/expenses?limit=500"),api("/api/system/products?limit=500"),api("/api/system/returns?limit=500")]);
 const productCosts=new Map(products.map(p=>[p.id,Number(p.cost_price||0)]));
 c.innerHTML='<div class="toolbar"><div><h2 style="font:700 24px Oswald;margin:0">Reports</h2><div class="muted">Sales, cost of goods, expenses and returns</div></div><select id="period"><option>This Month</option><option>Last Month</option><option>Last 3 Months</option><option>This Year</option></select></div><div id="reportCards" class="cards"></div><div class="panel" style="margin-top:16px"><div class="section-title"><h2>Monthly Performance</h2></div><div id="reportTable"></div></div>';
 const range=period=>{const now=new Date(),from=new Date(now.getFullYear(),now.getMonth(),1),to=new Date(now.getFullYear(),now.getMonth()+1,1);if(period==="Last Month")return {from:new Date(now.getFullYear(),now.getMonth()-1,1),to:from};if(period==="Last 3 Months")return {from:new Date(now.getFullYear(),now.getMonth()-2,1),to:new Date(now.getFullYear(),now.getMonth()+1,1)};if(period==="This Year")return {from:new Date(now.getFullYear(),0,1),to:new Date(now.getFullYear()+1,0,1)};return {from,to}};
 const inRange=(value,r)=>{if(!value)return false;const d=new Date(value);return Number.isFinite(d.getTime())&&d>=r.from&&d<r.to};
 const build=()=>{const r=range($("#period").value),valid=orders.filter(o=>!(/cancel/i.test(o.order_status||""))&&inRange(o.created_at,r)),exRows=expenses.filter(x=>inRange(x.expense_date||x.created_at,r)),retRows=returns.filter(x=>inRange(x.created_at,r));const sales=valid.reduce((n,o)=>n+Number(o.total_amount||0),0),cost=valid.reduce((n,o)=>n+(o.order_items||[]).reduce((m,i)=>m+Number(i.quantity||0)*Number(i.cost_price||productCosts.get(i.product_id)||0),0),0),ex=exRows.reduce((n,x)=>n+Number(x.amount||0),0),refunds=retRows.reduce((n,x)=>n+Number(x.refund_amount||0),0),profit=sales-cost-ex-refunds;$("#reportCards").innerHTML=[["Total Sales",money(sales)],["Cost of Goods",money(cost)],["Expenses",money(ex)],["Returns / Refunds",money(refunds)],["Net Profit",money(profit)],["Total Orders",valid.length]].map(x=>'<div class="card"><div class="muted">'+x[0]+'</div><div class="num">'+x[1]+'</div></div>').join("");const months=new Map();const getMonth=v=>String(v||"").slice(0,7);const bucket=m=>{if(!months.has(m))months.set(m,{month:m,sales:0,expenses:0,orders:0,returns:0});return months.get(m)};valid.forEach(o=>{const b=bucket(getMonth(o.created_at));b.sales+=Number(o.total_amount||0);b.orders++});exRows.forEach(x=>bucket(getMonth(x.expense_date||x.created_at)).expenses+=Number(x.amount||0));retRows.forEach(x=>bucket(getMonth(x.created_at)).returns+=Number(x.refund_amount||0));$("#reportTable").innerHTML=table([...months.values()].sort((a,b)=>b.month.localeCompare(a.month)),["month","sales","expenses","orders","returns"],false)||'<div class="empty">No report data for this period.</div>'};
 $("#period").onchange=build;build();
}
