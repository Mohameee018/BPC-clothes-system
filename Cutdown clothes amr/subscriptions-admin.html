<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BPC — إدارة الاشتراكات</title><link rel="stylesheet" href="style.css"></head><body><main style="min-height:100vh;padding:24px"><section class="checkout-card glass" style="max-width:1200px;width:100%;margin:auto"><p class="eyebrow">BPC PROVIDER</p><h1>إدارة اشتراكات العملاء</h1><p id="info">جارٍ التحقق…</p><div style="display:flex;gap:10px;flex-wrap:wrap;margin:18px 0"><a class="btn" href="/app.html">نظام العميل</a><button class="btn" id="logout">خروج</button></div><div id="plans"></div><hr style="margin:24px 0;border-color:rgba(255,255,255,.1)"><h2>إصدار كود تفعيل — دفع يدوي</h2><form id="activation" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px"><input name="name" placeholder="اسم العميل" required><input name="email" type="email" placeholder="Email" required><select name="plan_code" id="planSelect"></select><input name="amount" type="number" min="0" step="0.01" placeholder="المبلغ المدفوع"><input name="payment_reference" placeholder="مرجع التحويل"><button class="btn" type="submit">إصدار الكود</button></form><pre id="activationResult" style="white-space:pre-wrap"></pre><hr style="margin:24px 0;border-color:rgba(255,255,255,.1)"><h2>اشتراك جديد + حساب جاهز</h2><p style="opacity:.75">ده مناسب لما أنت تعمل الحساب بنفسك وتبعت للعميل البريد وكلمة المرور.</p><form id="account" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px"><input name="name" placeholder="اسم العميل" required><input name="email" type="email" placeholder="Email" required><select name="plan_code" id="planSelect2"></select><input name="amount" type="number" min="0" step="0.01" placeholder="المبلغ المدفوع"><input name="payment_reference" placeholder="مرجع التحويل"><button class="btn" type="submit">إنشاء الحساب</button></form><pre id="accountResult" style="white-space:pre-wrap"></pre><hr style="margin:24px 0;border-color:rgba(255,255,255,.1)"><h2>العملاء والاشتراكات</h2><div id="subs">Loading…</div></section></main><script>
let token="",plans=[];
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const api=async(url,opt={})=>{const r=await fetch(url,{...opt,headers:{Authorization:"Bearer "+token,"Content-Type":"application/json",...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Request failed");return d};
(async()=>{
 const cfg=await fetch("/api/public-config").then(r=>r.json()).catch(()=>({}));
 const sb=window.supabase?null:null;
 // Provider authentication uses the same Supabase access token stored by the app login.
 token=sessionStorage.getItem("bpc_admin_token")||"";
 if(!token){document.querySelector("#info").textContent="سجّل دخولك من /app.html بحساب مقدم الخدمة.";return}
 const me=await fetch("/api/auth/me",{headers:{Authorization:"Bearer "+token}});if(!me.ok){document.querySelector("#info").textContent="الجلسة غير صالحة.";return}
 const md=await me.json();document.querySelector("#info").textContent="جلسة موثقة — إدارة الاشتراكات تتطلب Super Admin.";
 try{plans=(await api("/api/admin/plans")).plans||[];document.querySelector("#plans").innerHTML='<h2>الباقات والأسعار</h2>'+plans.map(p=>'<div style="display:flex;gap:10px;align-items:center;margin:8px 0;flex-wrap:wrap"><b>'+esc(p.name)+'</b><span>'+p.duration_days+' يوم</span><input data-price="'+p.id+'" type="number" min="0" step="0.01" value="'+Number(p.price||0)+'"><label><input data-active="'+p.id+'" type="checkbox" '+(p.active?"checked":"")+'> مفعلة</label><button class="btn" data-save="'+p.id+'">حفظ</button></div>').join("");const opts=plans.map(p=>'<option value="'+esc(p.code)+'">'+esc(p.name)+'</option>').join("");document.querySelector("#planSelect").innerHTML=opts;document.querySelector("#planSelect2").innerHTML=opts;
 document.querySelectorAll("[data-save]").forEach(b=>b.onclick=async()=>{const id=b.dataset.save;await api("/api/admin/plans/"+id,{method:"PATCH",body:JSON.stringify({price:Number(document.querySelector("[data-price='"+id+"']").value),active:document.querySelector("[data-active='"+id+"']").checked})});load()});
 await load();
 }catch(e){document.querySelector("#info").textContent=e.message}
 async function load(){const d=await api("/api/admin/subscriptions");document.querySelector("#subs").innerHTML=d.length?d.map(s=>'<article style="padding:14px;border:1px solid rgba(255,255,255,.1);border-radius:12px;margin:10px 0"><b>'+esc(s.customer_name||"—")+'</b> · '+esc(s.customer_email||"—")+'<br><span>'+esc(s.subscription_plans?.name||"")+' · '+esc(s.status)+'</span><br>ينتهي: <b>'+new Date(s.expires_at).toLocaleString("ar-EG")+'</b><br><button class="btn" data-renew="'+s.id+'" style="margin-top:8px">تجديد نفس الباقة</button></article>').join(""):"لا توجد اشتراكات.";document.querySelectorAll("[data-renew]").forEach(b=>b.onclick=async()=>{if(!confirm("تجديد الاشتراك؟"))return;await api("/api/admin/subscriptions/renew",{method:"POST",body:JSON.stringify({subscription_id:b.dataset.renew})});await load()})}
 document.querySelector("#activation").onsubmit=async e=>{e.preventDefault();try{const d=await api("/api/admin/subscriptions/activation",{method:"POST",body:JSON.stringify(Object.fromEntries(new FormData(e.currentTarget).entries()))});document.querySelector("#activationResult").textContent="كود التفعيل: "+d.activation_code+"\nصالح حتى: "+new Date(d.expires_at).toLocaleString("ar-EG");await load()}catch(e){document.querySelector("#activationResult").textContent=e.message}};
 document.querySelector("#account").onsubmit=async e=>{e.preventDefault();try{const d=await api("/api/admin/subscriptions/create",{method:"POST",body:JSON.stringify(Object.fromEntries(new FormData(e.currentTarget).entries()))});document.querySelector("#accountResult").textContent="Email: "+d.account.email+"\nPassword: "+d.account.password+"\nينتهي: "+new Date(d.subscription.expires_at).toLocaleString("ar-EG");await load()}catch(e){document.querySelector("#accountResult").textContent=e.message}};
 document.querySelector("#logout").onclick=()=>{sessionStorage.removeItem("bpc_admin_token");location.href="/app.html"};
})();
</script></body></html>
