<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BPC Clothes System — إنشاء الحساب</title><link rel="stylesheet" href="style.css"></head><body><main style="min-height:100vh;padding:32px"><section class="checkout-card glass" style="max-width:620px;width:100%;margin:auto"><p class="eyebrow">BPC CLOTHES SYSTEM</p><h1>إنشاء حساب النظام</h1><p>لازم يكون معاك كود تفعيل تم إصداره بعد شراء الاشتراك.</p><form id="f" style="display:grid;gap:12px;margin-top:20px"><input name="name" placeholder="الاسم" maxlength="120" required><input name="email" type="email" placeholder="البريد الإلكتروني" maxlength="254" required><input name="phone" placeholder="رقم الهاتف" maxlength="40"><input name="activation_code" placeholder="كود التفعيل" autocomplete="one-time-code" required><input name="password" type="password" placeholder="كلمة المرور — 8 أحرف على الأقل" minlength="8" required><button class="btn" type="submit">إنشاء الحساب</button><div id="msg"></div></form><p style="margin-top:18px"><a href="/app.html">عندي حساب بالفعل</a> · <a href="/plans.html">الباقات</a></p></section></main><script>
const f=document.querySelector("#f"),msg=document.querySelector("#msg");
f.onsubmit=async e=>{e.preventDefault();msg.textContent="جارٍ إنشاء الحساب…";const body=Object.fromEntries(new FormData(f).entries());const r=await fetch("/api/subscription/signup",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const d=await r.json();if(!r.ok){msg.textContent=d.error||"تعذر إنشاء الحساب.";return}msg.textContent=d.requires_email_confirmation?"تم إنشاء الحساب. راجع بريدك لتأكيد الحساب ثم ادخل من صفحة النظام.":"تم إنشاء الحساب وتفعيل الاشتراك. يمكنك الدخول الآن.";if(d.session){sessionStorage.setItem("bpc_admin_token",d.session.access_token);location.href="/app.html"}};
</script></body></html>
