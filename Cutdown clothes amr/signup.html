<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="إنشاء حساب BPC Clothes System بعد شراء الاشتراك.">
<title>BPC Clothes System — إنشاء الحساب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
body.signup-page{background:#061b10;color:#f7fbf8;font-family:Inter,sans-serif;min-height:100vh}
.signup-shell{min-height:100vh;display:grid;place-items:center;padding:24px;position:relative;overflow:hidden}
.signup-shell:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 25% 20%,rgba(57,201,121,.18),transparent 35%),radial-gradient(circle at 80% 80%,rgba(142,233,177,.1),transparent 30%)}
.signup-card{position:relative;z-index:1;width:min(620px,100%);padding:34px;border:1px solid rgba(190,255,214,.16);border-radius:28px;background:rgba(8,43,25,.68);backdrop-filter:blur(24px);box-shadow:0 28px 90px rgba(0,0,0,.25)}
.signup-top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:34px}
.signup-brand{font-weight:700;letter-spacing:-.04em}.signup-back{font-size:12px;color:rgba(247,251,248,.58)}
.signup-eyebrow{font-size:11px;letter-spacing:.18em;color:#8ee9b1;margin:0 0 12px}
.signup-card h1{font-size:clamp(40px,7vw,58px);line-height:1;letter-spacing:-.055em;font-weight:500;margin:0 0 14px}
.signup-copy{color:rgba(247,251,248,.62);line-height:1.7;margin:0 0 24px}
.signup-plan{padding:12px 14px;border-radius:14px;background:rgba(57,201,121,.09);border:1px solid rgba(142,233,177,.16);font-size:13px;margin-bottom:18px}
.signup-form{display:grid;gap:12px}
.signup-form input{width:100%;border:1px solid rgba(255,255,255,.12);background:rgba(247,251,248,.96);color:#0b1710;padding:13px 14px;border-radius:13px;outline:none}
.signup-form input:focus{border-color:#39c979;box-shadow:0 0 0 3px rgba(57,201,121,.13)}
.signup-form button{border:0;border-radius:14px;padding:14px;background:#39c979;color:#062617;font-weight:600;cursor:pointer}
.signup-form button:hover{background:#8ee9b1}
.signup-form button:disabled{opacity:.55;cursor:not-allowed}
.signup-msg{min-height:22px;font-size:13px;line-height:1.5}
.signup-links{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;padding-top:18px;border-top:1px solid rgba(255,255,255,.1);font-size:12px}
.signup-links a{color:rgba(247,251,248,.68)}.signup-links a:hover{color:#8ee9b1}
.signup-links b{color:#8ee9b1}
</style>
</head>
<body class="signup-page">
<main class="signup-shell">
<section class="signup-card">
  <div class="signup-top">
    <a class="signup-brand" href="/index.html">BPC <span style="color:#8ee9b1">CLOTHES SYSTEM</span></a>
    <a class="signup-back" href="/plans.html">الباقات</a>
  </div>
  <p class="signup-eyebrow">PAID ACCESS · ACCOUNT SETUP</p>
  <h1>حسابك يبدأ من هنا.</h1>
  <p class="signup-copy">بعد شراء الاشتراك، استخدم كود التفعيل الذي وصلك لإنشاء حسابك وربطه تلقائيًا بالشركة والباقة الخاصة بك.</p>
  <div id="selectedPlan" class="signup-plan">جاري التحقق من الباقة…</div>
  <form id="f" class="signup-form">
    <input name="name" placeholder="الاسم" maxlength="120" required>
    <input name="email" type="email" placeholder="البريد الإلكتروني" maxlength="254" required>
    <input name="phone" placeholder="رقم الهاتف" maxlength="40">
    <input name="activation_code" placeholder="كود التفعيل" autocomplete="one-time-code" required>
    <input name="password" type="password" placeholder="كلمة المرور — 8 أحرف على الأقل" minlength="8" required>
    <button type="submit">إنشاء الحساب وتفعيل الاشتراك ←</button>
    <div id="msg" class="signup-msg" aria-live="polite"></div>
  </form>
  <div class="signup-links">
    <a href="/app.html">عندي حساب بالفعل · <b>تسجيل الدخول</b></a>
    <a href="/plans.html">مش عارف تدفع؟ <b>شوف الباقات وتواصل مع الدعم</b></a>
  </div>
</section>
</main>
<script>
const f=document.querySelector("#f"),msg=document.querySelector("#msg"),selected=document.querySelector("#selectedPlan");
(async()=>{
  const code=new URLSearchParams(location.search).get("plan");
  const r=await fetch("/api/subscription/plans").catch(()=>null);
  const d=r?await r.json().catch(()=>({})):{};
  const plan=(d.plans||[]).find(x=>String(x.code)===String(code));
  selected.textContent=plan?("الباقة المختارة: "+plan.name+" · "+Number(plan.price||0).toLocaleString("ar-EG")+" EGP"): "لديك كود تفعيل جاهز؟ أدخله هنا لإكمال التسجيل.";
})();
f.onsubmit=async e=>{
  e.preventDefault();msg.textContent="جارٍ إنشاء الحساب…";msg.style.color="rgba(247,251,248,.65)";
  const button=f.querySelector("button");button.disabled=true;
  try{
    const body=Object.fromEntries(new FormData(f).entries());
    const r=await fetch("/api/subscription/signup",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    const d=await r.json().catch(()=>({}));
    if(!r.ok){msg.textContent=d.error||"تعذر إنشاء الحساب.";msg.style.color="#ffb4b4";return}
    msg.textContent=d.requires_email_confirmation?"تم إنشاء الحساب. راجع بريدك لتأكيد الحساب ثم سجل الدخول.":"تم إنشاء الحساب وتفعيل الاشتراك. يمكنك الدخول الآن.";
    msg.style.color="#8ee9b1";
    if(d.session){sessionStorage.setItem("bpc_admin_token",d.session.access_token);location.href="/app.html"}
  }catch{msg.textContent="تعذر الاتصال بالخدمة. حاول مرة أخرى.";msg.style.color="#ffb4b4"}
  finally{button.disabled=false}
};
</script>
</body>
</html>
