<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BPC Clothes System Account Recovery</title><link rel="stylesheet" href="style.css"></head><body><main style="min-height:100vh;padding:32px;display:grid;place-items:center"><section class="checkout-card glass" style="max-width:520px;width:100%"><p class="eyebrow">CUTDOWN ACCOUNT</p><h1>Recover access.</h1><form id="recoveryForm" style="display:grid;gap:12px"><input id="email" type="email" autocomplete="email" placeholder="Email" required><button class="btn full" type="submit">Send recovery email <span>→</span></button><p id="msg"></p></form><form id="changeForm" style="display:none;gap:12px"><input id="newPassword" type="password" autocomplete="new-password" minlength="8" placeholder="New password" required><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" placeholder="Confirm new password" required><button class="btn full" type="submit">Set new password <span>→</span></button><p id="changeMsg"></p></form><a class="btn" href="/">Back to store <span>↗</span></a></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script><script>
(async()=>{
 const cfg=await fetch("/api/public-config").then(r=>r.json());const sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseKey);
 const recovery=document.querySelector("#recoveryForm"),change=document.querySelector("#changeForm");
 sb.auth.onAuthStateChange((event)=>{if(event==="PASSWORD_RECOVERY"){recovery.style.display="none";change.style.display="grid"}});
 recovery.onsubmit=async e=>{e.preventDefault();const email=document.querySelector("#email").value.trim();const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+"/reset-password"});document.querySelector("#msg").textContent=error?"Could not send the recovery email.":"If an account exists for that email, a recovery email has been sent."};
 change.onsubmit=async e=>{e.preventDefault();const a=document.querySelector("#newPassword").value,b=document.querySelector("#confirmPassword").value,msg=document.querySelector("#changeMsg");if(a!==b){msg.textContent="Passwords do not match.";return}const {error}=await sb.auth.updateUser({password:a});if(error){msg.textContent="Could not update password.";return}msg.textContent="Password updated successfully.";await sb.auth.signOut()};
})();
</script></body></html>
